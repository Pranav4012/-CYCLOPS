<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CYCLOPS — SOC Console</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --panel2:#0d141d; --line:#1e2a3a;
    --ink:#e6edf3; --dim:#7d8fa3; --accent:#38bdf8;
    --ok:#34d399; --warn:#fbbf24; --crit:#f87171; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d141d,#0a0e14)}
  .logo{font-weight:800;letter-spacing:.14em;font-size:18px}
  .logo b{color:var(--accent)}
  .grow{flex:1}
  .pill{font:12px/1 var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  main{max-width:1200px;margin:0 auto;padding:22px;display:grid;gap:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .k{font:11px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .card .v{font-size:26px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:820px){.row{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel h2{margin:0;padding:12px 16px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .body{padding:14px 16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:11px/1 var(--mono);padding:6px 9px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
  .chip.on{color:var(--ok);border-color:#1c3a30;background:#0e1a16}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font:11px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  td.mono,.mono{font-family:var(--mono);font-size:12px}
  .sev{font:11px/1 var(--mono);padding:3px 7px;border-radius:6px;display:inline-block}
  .sev.critical{background:#2a1113;color:var(--crit)} .sev.high{background:#2a1f0d;color:var(--warn)}
  .sev.medium,.sev.low{background:#0e1a22;color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#132234;color:var(--ink);padding:8px 12px}
  button:hover{border-color:var(--accent)} button:disabled{opacity:.5;cursor:default}
  .btn-v{padding:5px 9px;font-size:12px}
  .feed{max-height:300px;overflow:auto;font-family:var(--mono);font-size:12px}
  .feed div{padding:5px 0;border-bottom:1px solid #16202c;color:var(--dim)}
  .feed .ev{color:var(--accent)}
  input[type=file]{font:13px var(--mono);color:var(--dim)}
  .verdict{margin-left:8px;font:11px var(--mono)} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--crit)}
  .muted{color:var(--dim)} .empty{color:var(--dim);padding:14px 16px;font-style:italic}
</style>
</head>
<body>
<header>
  <div class="logo"><b>◉</b> CYCLOPS</div>
  <span class="pill"><span id="live-dot" class="dot"></span><span id="live-txt">connecting…</span></span>
  <div class="grow"></div>
  <span class="pill" id="engine">engine —</span>
  <span class="pill" id="sensor">sensor —</span>
  <span class="pill" id="ledger">ledger —</span>
</header>

<main>
  <section class="cards" id="cards">
    <div class="card"><div class="k">Packets</div><div class="v" id="m-packets">0</div></div>
    <div class="card"><div class="k">Flows</div><div class="v" id="m-flows">0</div></div>
    <div class="card"><div class="k">Alerts</div><div class="v" id="m-alerts">0</div></div>
    <div class="card"><div class="k">Incidents</div><div class="v" id="m-incidents">0</div></div>
    <div class="card"><div class="k">Packets/s</div><div class="v" id="m-pps">0</div></div>
  </section>

  <div class="panel">
    <h2>Detectors</h2>
    <div class="body"><div class="chips" id="detectors"><span class="muted">—</span></div></div>
  </div>

  <div class="panel">
    <h2>Ingest a capture</h2>
    <div class="body">
      <input type="file" id="pcap" accept=".pcap,.pcapng" />
      <button id="upload">Upload &amp; analyze</button>
      <span id="job" class="mono muted"></span>
    </div>
  </div>

  <div class="row">
    <div class="panel">
      <h2>Alerts <span class="grow"></span><button id="refresh" class="btn-v">refresh</button></h2>
      <div id="alerts-wrap"><div class="empty">No alerts yet — upload a capture.</div></div>
    </div>
    <div class="panel">
      <h2>Live event feed</h2>
      <div class="body feed" id="feed"><div class="muted">waiting for events…</div></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString();

async function j(url, opts){ const r = await fetch(url, opts); if(!r.ok) throw new Error(url+" "+r.status); return r.json(); }

async function refreshStatus(){
  try{
    const s = await j("/api/status");
    $("engine").textContent = "engine " + (s.engine_version||"—");
    $("sensor").textContent = "sensor " + (s.sensor_id||"—");
    const intact = s.ledger && s.ledger.chain_intact;
    $("ledger").innerHTML = '<span class="dot '+(intact?'on':'')+'"></span>ledger '+(intact?'intact':'—');
    const m = s.metrics||{};
    $("m-packets").textContent = fmt(m.packets_processed);
    $("m-flows").textContent = fmt(m.flows_created);
    $("m-alerts").textContent = fmt(m.alerts_generated);
    $("m-incidents").textContent = fmt(m.incidents_created);
    $("m-pps").textContent = fmt((m.processing||{}).packets_per_second);
    const d = s.detectors||{};
    $("detectors").innerHTML = Object.keys(d).length
      ? Object.entries(d).map(([k,v])=>'<span class="chip '+(v==="online"?"on":"")+'">'+k+'</span>').join("")
      : '<span class="muted">—</span>';
  }catch(e){ /* backend not ready yet */ }
}

function sevClass(s){ s=(s||"").toLowerCase(); return ["critical","high","medium","low"].includes(s)?s:"low"; }

async function refreshAlerts(){
  try{
    const p = await j("/api/alerts?limit=100");
    const items = p.items||[];
    if(!items.length){ $("alerts-wrap").innerHTML = '<div class="empty">No alerts yet — upload a capture.</div>'; return; }
    const rows = items.map(a=>{
      const conf = a.confidence!=null ? (a.confidence*100).toFixed(1)+"%" : "—";
      return `<tr>
        <td><span class="sev ${sevClass(a.severity)}">${(a.severity||"").toUpperCase()}</span></td>
        <td class="mono">${a.detector||""}</td>
        <td>${a.threat||""}<div class="muted mono" style="font-size:11px">${a.title||""}</div></td>
        <td class="mono">${conf}</td>
        <td class="mono" style="font-size:11px">${a.source||""}</td>
        <td><button class="btn-v" data-ev="${a.evidence_id||""}">verify</button><span class="verdict" id="v-${a.evidence_id||""}"></span></td>
      </tr>`;
    }).join("");
    $("alerts-wrap").innerHTML = `<table><thead><tr>
      <th>Severity</th><th>Detector</th><th>Threat</th><th>Conf.</th><th>Source</th><th>Evidence</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    $("alerts-wrap").querySelectorAll("button[data-ev]").forEach(b=>b.onclick=()=>verify(b.dataset.ev));
  }catch(e){}
}

async function verify(id){
  if(!id) return;
  const el = $("v-"+id); el.textContent="…"; el.className="verdict";
  try{
    const r = await j("/api/evidence/"+encodeURIComponent(id)+"/verify");
    el.textContent = r.verified ? "✓ sealed" : "✗ TAMPER";
    el.className = "verdict "+(r.verified?"ok":"bad");
  }catch(e){ el.textContent="error"; el.className="verdict bad"; }
}

$("upload").onclick = async ()=>{
  const f = $("pcap").files[0];
  if(!f){ $("job").textContent="choose a .pcap first"; return; }
  $("upload").disabled=true; $("job").textContent="uploading "+f.name+"…";
  try{
    const fd = new FormData(); fd.append("file", f);
    const r = await j("/api/pcap/upload",{method:"POST",body:fd});
    const jobId = r.job_id; $("job").textContent="queued "+jobId;
    const poll = setInterval(async ()=>{
      try{
        const job = await j("/api/jobs/"+jobId);
        $("job").textContent = jobId+" — "+job.status;
        if(job.status==="completed"||job.status==="failed"){
          clearInterval(poll); $("upload").disabled=false;
          refreshStatus(); refreshAlerts();
        }
      }catch(e){ clearInterval(poll); $("upload").disabled=false; }
    }, 900);
  }catch(e){ $("job").textContent="upload failed: "+e.message; $("upload").disabled=false; }
};
$("refresh").onclick = ()=>{ refreshStatus(); refreshAlerts(); };

function pushFeed(ev){
  const feed = $("feed");
  if(feed.querySelector(".muted")) feed.innerHTML="";
  const t = new Date().toLocaleTimeString();
  const name = ev.event || ev.type || "EVENT";
  const extra = ev.count!=null?(" ×"+ev.count):(ev.status?(" "+ev.status):"");
  const div = document.createElement("div");
  div.innerHTML = `<span class="muted">${t}</span> <span class="ev">${name}</span><span class="muted">${extra}</span>`;
  feed.prepend(div);
  while(feed.childElementCount>60) feed.lastChild.remove();
}

function connectWS(){
  const proto = location.protocol==="https:"?"wss":"ws";
  const ws = new WebSocket(proto+"://"+location.host+"/api/live");
  ws.onopen = ()=>{ $("live-dot").className="dot on"; $("live-txt").textContent="live"; };
  ws.onclose = ()=>{ $("live-dot").className="dot"; $("live-txt").textContent="reconnecting…"; setTimeout(connectWS,2000); };
  ws.onmessage = e=>{
    let m; try{ m=JSON.parse(e.data);}catch{ return; }
    if(m.type==="ready"||m.type==="health") return;
    pushFeed(m);
    if(["alerts_updated","job_completed"].includes(m.type)){ refreshStatus(); refreshAlerts(); }
  };
}

refreshStatus(); refreshAlerts(); connectWS();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
